name: Build and publish

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and test distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
          python-version: "3.11"

      - name: Check release tag matches the package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          uv run --no-project python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"Release tag {actual!r} must match package version: {expected}")
          PY

      - name: Build source distribution and wheel
        run: uv build --no-sources

      - name: Check package metadata and README
        run: uvx twine check --strict dist/*

      - name: Test the installed wheel
        run: |
          uv venv "$RUNNER_TEMP/tact-test"
          uv pip install --python "$RUNNER_TEMP/tact-test/bin/python" dist/*.whl
          "$RUNNER_TEMP/tact-test/bin/python" -m unittest discover -s tests -v

      - name: Save tested distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tact-agent-kit/
    permissions:
      id-token: write
    steps:
      - name: Download tested distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist/
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
