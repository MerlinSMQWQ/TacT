[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tact-agent-kit"
version = "0.1.2"
description = "Initialize a repository with the TacT developer and agent collaboration kit."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development",
]

[project.scripts]
tact = "tact.cli:main"

[project.urls]
Homepage = "https://github.com/MerlinSMQWQ/TacT"
Repository = "https://github.com/MerlinSMQWQ/TacT"
Issues = "https://github.com/MerlinSMQWQ/TacT/issues"

[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "AGENTS.md", "core", "project/README.md", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/tact"]

# A separate resource namespace also works with editable installs, while keeping
# the Markdown at its existing authoring locations as the only source of truth.
[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "tact_resources/AGENTS.md"
"LICENSE" = "tact_resources/LICENSE"
"core" = "tact_resources/core"
"project/README.md" = "tact_resources/project/README.md"
